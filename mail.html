<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Image Lightbox</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d0d0d;
      --surface: #161616;
      --accent: #c9a96e;
      --text: #e8e0d4;
      --muted: #6b6560;
      --overlay: rgba(5, 5, 5, 0.95);
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Cormorant Garamond', Georgia, serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    /* Subtle grain overlay */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 0;
      opacity: 0.6;
    }

    header {
      position: relative;
      z-index: 1;
      text-align: center;
      margin-bottom: 60px;
    }

    header h1 {
      font-size: clamp(2rem, 5vw, 3.5rem);
      font-weight: 300;
      letter-spacing: 0.15em;
      color: var(--text);
    }

    header p {
      font-size: 1rem;
      color: var(--muted);
      letter-spacing: 0.2em;
      margin-top: 8px;
      font-weight: 300;
    }

    /* Gallery grid */
    .gallery {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 20px;
      width: 100%;
      max-width: 1000px;
    }

    .gallery-item {
      position: relative;
      overflow: hidden;
      cursor: pointer;
      border: 1px solid rgba(201, 169, 110, 0.15);
      background: var(--surface);
      aspect-ratio: 4/3;
      transition: border-color 0.4s ease, transform 0.4s ease;
    }

    .gallery-item:hover {
      border-color: rgba(201, 169, 110, 0.5);
      transform: translateY(-4px);
    }

    .gallery-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.6s ease, filter 0.4s ease;
      filter: brightness(0.85) saturate(0.9);
    }

    .gallery-item:hover img {
      transform: scale(1.06);
      filter: brightness(1) saturate(1.05);
    }

    .gallery-item .caption {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 28px 18px 16px;
      background: linear-gradient(to top, rgba(0,0,0,0.7), transparent);
      font-size: 0.8rem;
      letter-spacing: 0.18em;
      color: var(--accent);
      text-transform: uppercase;
      transform: translateY(6px);
      opacity: 0;
      transition: opacity 0.3s ease, transform 0.3s ease;
    }

    .gallery-item:hover .caption {
      opacity: 1;
      transform: translateY(0);
    }

    .expand-hint {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 32px;
      height: 32px;
      background: rgba(201, 169, 110, 0.15);
      border: 1px solid rgba(201, 169, 110, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .gallery-item:hover .expand-hint {
      opacity: 1;
    }

    .expand-hint svg { width: 14px; height: 14px; stroke: var(--accent); fill: none; }

    /* ── LIGHTBOX ── */
    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 1000;
      background: var(--overlay);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
      backdrop-filter: blur(6px);
    }

    .lightbox.active {
      opacity: 1;
      pointer-events: all;
    }

    .lightbox-img-wrap {
      position: relative;
      max-width: 92vw;
      max-height: 88vh;
      transform: scale(0.9) translateY(20px);
      transition: transform 0.45s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.4s ease;
      opacity: 0;
    }

    .lightbox.active .lightbox-img-wrap {
      transform: scale(1) translateY(0);
      opacity: 1;
    }

    .lightbox-img-wrap img {
      display: block;
      max-width: 100%;
      max-height: 88vh;
      object-fit: contain;
      border: 1px solid rgba(201, 169, 110, 0.2);
      box-shadow: 0 40px 100px rgba(0,0,0,0.8);
    }

    /* Close button — top-left */
    .close-btn {
      position: fixed;
      top: 24px;
      left: 24px;
      width: 48px;
      height: 48px;
      background: transparent;
      border: 1px solid rgba(201, 169, 110, 0.4);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.25s ease, border-color 0.25s ease, transform 0.25s ease;
      z-index: 1001;
    }

    .close-btn:hover {
      background: rgba(201, 169, 110, 0.12);
      border-color: var(--accent);
      transform: rotate(90deg);
    }

    .close-btn svg {
      width: 20px;
      height: 20px;
      stroke: var(--accent);
      fill: none;
      stroke-width: 1.5;
    }

    .lightbox-label {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.75rem;
      letter-spacing: 0.25em;
      color: var(--muted);
      text-transform: uppercase;
    }

    footer {
      position: relative;
      z-index: 1;
      margin-top: 60px;
      font-size: 0.75rem;
      letter-spacing: 0.2em;
      color: var(--muted);
      text-transform: uppercase;
    }
  </style>
</head>
<body>

  <header>
    <h1>The Archive</h1>
    <p>Click any image to expand</p>
  </header>

  <div class="gallery" id="gallery">

    <div class="gallery-item" data-label="Mountain Serenity" onclick="openLightbox(this)">
      <img src="https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=900&q=80" alt="Mountain landscape"/>
      <div class="caption">Mountain Serenity</div>
      <div class="expand-hint">
        <svg viewBox="0 0 24 24" stroke-width="2"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg>
      </div>
    </div>

    <div class="gallery-item" data-label="Ocean Horizon" onclick="openLightbox(this)">
      <img src="https://images.unsplash.com/photo-1505118380757-91f5f5632de0?w=900&q=80" alt="Ocean at sunset"/>
      <div class="caption">Ocean Horizon</div>
      <div class="expand-hint">
        <svg viewBox="0 0 24 24" stroke-width="2"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg>
      </div>
    </div>

    <div class="gallery-item" data-label="Forest Mist" onclick="openLightbox(this)">
      <img src="https://images.unsplash.com/photo-1448375240586-882707db888b?w=900&q=80" alt="Misty forest"/>
      <div class="caption">Forest Mist</div>
      <div class="expand-hint">
        <svg viewBox="0 0 24 24" stroke-width="2"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg>
      </div>
    </div>

    <div class="gallery-item" data-label="Desert Dunes" onclick="openLightbox(this)">
      <img src="https://images.unsplash.com/photo-1509316785289-025f5b846b35?w=900&q=80" alt="Desert dunes"/>
      <div class="caption">Desert Dunes</div>
      <div class="expand-hint">
        <svg viewBox="0 0 24 24" stroke-width="2"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg>
      </div>
    </div>

    <div class="gallery-item" data-label="Northern Lights" onclick="openLightbox(this)">
      <img src="https://images.unsplash.com/photo-1531366936337-7c912a4589a7?w=900&q=80" alt="Northern lights"/>
      <div class="caption">Northern Lights</div>
      <div class="expand-hint">
        <svg viewBox="0 0 24 24" stroke-width="2"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg>
      </div>
    </div>

    <div class="gallery-item" data-label="Waterfall Veil" onclick="openLightbox(this)">
      <img src="aws academy certificate.jpg" alt="Waterfall"/>
      <div class="caption">Waterfall Veil</div>
      <div class="expand-hint">
        <svg viewBox="0 0 24 24" stroke-width="2"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg>
      </div>
    </div>

  </div>

  <footer>Photography Gallery &mdash; Click to Expand</footer>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox" onclick="handleOverlayClick(event)">
    <button class="close-btn" id="closeBtn" onclick="closeLightbox()">
      <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
    <div class="lightbox-img-wrap" id="lightboxImgWrap">
      <img id="lightboxImg" src="" alt=""/>
    </div>
    <div class="lightbox-label" id="lightboxLabel"></div>
  </div>

  <script>
    const lightbox      = document.getElementById('lightbox');
    const lightboxImg   = document.getElementById('lightboxImg');
    const lightboxLabel = document.getElementById('lightboxLabel');

    function openLightbox(item) {
      const img   = item.querySelector('img');
      const label = item.dataset.label || '';
      lightboxImg.src   = img.src;
      lightboxImg.alt   = img.alt;
      lightboxLabel.textContent = label;
      lightbox.classList.add('active');
      document.body.style.overflow = 'hidden';
    }

    function closeLightbox() {
      lightbox.classList.remove('active');
      document.body.style.overflow = '';
      // clear src after transition so img doesn't flash
      setTimeout(() => { lightboxImg.src = ''; }, 400);
    }

    function handleOverlayClick(e) {
      // Close only if clicking the backdrop itself
      if (e.target === lightbox) closeLightbox();
    }

    // Keyboard support
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') closeLightbox();
    });
  </script>
</body>
</html>
